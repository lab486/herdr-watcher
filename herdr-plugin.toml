id = "herdr-watcher"
name = "Herdr Watcher"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Local mobile-first web dashboard for herdr agents: status, prompts, and chat."
platforms = ["macos", "linux", "windows"]

[[build]]
command = ["npm", "--prefix", "web", "ci"]

[[build]]
command = ["npm", "--prefix", "web", "run", "build"]

[[startup]]
command = ["node", "bin/launch.js"]

# Watchdog: start the server if it died, or if the plugin was installed while herdr
# was already running (startup hooks don't run on install, link or enable).
[[events]]
on = "pane.agent_detected"
command = ["node", "bin/launch.js"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "bin/launch.js"]

[[events]]
on = "pane.focused"
command = ["node", "bin/launch.js"]

[[actions]]
id = "open"
title = "Watcher: open dashboard"
contexts = ["workspace"]
command = ["node", "bin/open.js"]

[[actions]]
id = "restart"
title = "Watcher: restart server"
contexts = ["workspace"]
command = ["node", "bin/restart.js"]
